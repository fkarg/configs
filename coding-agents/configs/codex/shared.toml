"github.com" = "allow"
"golang.org" = "allow"
"index.crates.io" = "allow"
"mods.factorio.com" = "allow"
"objects.githubusercontent.com" = "allow"
# Public tokenizer vocabularies fetched by tiktoken.
"openaipublic.blob.core.windows.net" = "allow"
# Claude CLI authentication/platform requests during peer-review calls.
"platform.claude.com" = "allow"
"proxy.golang.org" = "allow"
"pypi.org" = "allow"
