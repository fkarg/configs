# Curated codex settings shared across machines.
#
# Codex (the CLI *and* the VS Code app-server) reads ~/.codex/config.toml and
# rewrites it in place — trusted [projects.*], oss_provider, nux counters, auth.
# We can't symlink that file (codex's atomic rename would clobber the link) and
# we don't want its host-specific state in this public repo. So the coding_agents
# ansible role runs merge_codex_config.py to overlay just these keys onto the
# local file, preserving everything codex owns.
#
# Put ONLY machine-independent preferences here. Never trusted paths, providers,
# or anything secret.
#
# `unmanage` lists formerly-curated top-level keys to DELETE from the local
# config on merge — codex's built-in default takes over. Used to retire pins
# (e.g. the old model pin) without leaving stale values on other hosts.
unmanage = ["model", "model_reasoning_effort"]
personality = "pragmatic"
web_search = "live"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
# Codex-only additions to the shared AGENTS.md, appended to the system prompt.
developer_instructions = """
- Run `gh` commands that need GitHub authentication on the host, outside the workspace sandbox. The `gh` prefix is generally pre-approved; a sandboxed call cannot access the host keyring and will fail with 401.
- When a needed command fails because the Codex sandbox blocks network access or a destination is absent from its domain allowlist, inspect the command and destination, then retry the narrowest appropriate command with sandbox escalation and a concrete justification. Use automatic review when available. If it denies an action still needed for the task, tell me the command, destination, and stated reason, and ask me for approval; do not work around the denial. For a recurring legitimate destination, also update the shared Codex domain allowlist in the configs repo (`coding-agents/configs/codex/shared.toml`).
- When you call a Claude peer and `peer-review` reports expired OAuth or another Claude authentication failure inside the sandbox, retry the same call outside the sandbox with the narrowest escalation and a concrete justification. The sandbox may lack access to the host's working Claude login; do not conclude that Claude is unavailable or ask for a new login based on the sandbox error alone. If the host retry also fails, report that failure and use the normal peer fallback.
"""

[agents]
max_concurrent_threads_per_session = 16

[sandbox_workspace_write]
# The merge script expands ~/ paths per host before writing config.toml.
# Keep this to individually trusted repositories; never grant ~/Coding itself.
writable_roots = [
  "~/Coding/infrastructure",
  "~/Coding/frontend-react",
  "~/Coding/fkarg.github.io",
  "~/Coding/backend-core",
  "~/Coding/operation",
  "~/Coding/UnifestBestellBot",
  "~/configs",
  "~/finances",
]
# Commands can reach only the domains allowed by the proxy below.
network_access = true

[features]
# Common developer endpoints. Keep this explicit: `network_access` without the
# proxy would permit arbitrary egress.
[features.network_proxy]
enabled = true
allow_local_binding = true

[features.network_proxy.domains]
# Codex's own feature-flag endpoint. Not a developer endpoint, but the CLI
# calls it during normal operation and the proxy denial surfaces as a mid-run
# choke rather than a clean skip.
"ab.chatgpt.com" = "allow"
"api.anthropic.com" = "allow"
"api.github.com" = "allow"
"api.openai.com" = "allow"
"auth.docker.io" = "allow"
"codeload.github.com" = "allow"
"cloud-images.ubuntu.com" = "allow"
"crates.io" = "allow"
"deb.debian.org" = "allow"
"files.pythonhosted.org" = "allow"
"galaxy.ansible.com" = "allow"
